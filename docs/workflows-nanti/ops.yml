name: Ops (keepalive & backup)

on:
  schedule:
    - cron: "0 1 * * *"      # keepalive harian
    - cron: "0 19 * * 0"     # backup mingguan (Minggu 02:00 WIB)
  workflow_dispatch:

jobs:
  keepalive:
    if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ping API agar project free tier tidak di-pause
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'

  backup:
    if: github.event.schedule == '0 19 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # DB_URL: gunakan connection string SESSION POOLER (runner GitHub hanya IPv4).
      # Versi image harus >= versi Postgres project (cek di dashboard Supabase).
      - name: Dump schema public
        run: |
          docker run --rm -e DB_URL="${{ secrets.BACKUP_DB_URL }}" -v "$PWD:/out" postgres:17 \
            sh -c 'pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -Fc -f /out/wts.dump'
      - name: Enkripsi (data pribadi mahasiswa!)
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.BACKUP_PASSPHRASE }}" \
              --symmetric --cipher-algo AES256 -o wts-$(date +%F).dump.gpg wts.dump
          rm wts.dump
      - uses: actions/upload-artifact@v4
        with:
          name: wts-backup
          path: "*.dump.gpg"
          retention-days: 30
